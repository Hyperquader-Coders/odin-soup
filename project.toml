# What odin-soup is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-soup"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for libsoup 3, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "libsoup",
  "linux",
  "odin",
  "runic",
]
collection = "soup"

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"

[build]
packages = [
  "libsoup-3.0-dev",
]
lib = [
  "soup",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
